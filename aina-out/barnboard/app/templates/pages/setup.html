<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext x='1' y='13' font-size='13'%3E%F0%9F%90%83%3C/text%3E%3C/svg%3E">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Welcome · {{ app_name }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/app.css">
  <link rel="stylesheet" href="/static/css/barnboard.css">
</head>
<body>
  <div style="min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px">
    <div class="card" style="width:100%; max-width:400px">
      <div class="card__body" style="padding:28px">
        <div style="text-align:center; margin-bottom:20px">
          <div style="font-size:36px">🐃</div>
          <h1 style="margin:8px 0 4px; font-size:22px">Welcome to {{ app_name }}</h1>
          <p class="muted" style="margin:0">First things first — create the farm login.
          Everyone who milks shares this one account.</p>
        </div>
        {% if error %}
          <div class="banner-danger" style="margin-bottom:14px">{{ t(error) }}</div>
        {% endif %}
        <form method="post" action="/setup">
          <div class="field">
            <label for="username">{{ t('Username') }}</label>
            <input class="input" id="username" name="username" autocomplete="username"
                   placeholder="e.g. farm" required autofocus>
          </div>
          <div class="field">
            <label for="password">{{ t('Password (8+ characters)') }}</label>
            <input class="input" id="password" name="password" type="password"
                   autocomplete="new-password" minlength="8" required>
          </div>
          <div class="field">
            <label for="password2">{{ t('Repeat password') }}</label>
            <input class="input" id="password2" name="password2" type="password"
                   autocomplete="new-password" minlength="8" required>
          </div>
          <hr style="border:none; border-top:1px solid var(--border); margin:16px 0">
          <p class="faint" style="font-size:12px; margin:0 0 8px">{{ t('So you can reset your own password later:') }}</p>
          <div class="field">
            <label for="question">{{ t('Recovery question') }}</label>
            <select class="input" id="question" name="question" required>
              {% for q in questions %}<option value="{{ q }}">{{ t(q) }}</option>{% endfor %}
            </select>
          </div>
          <div class="field">
            <label for="answer">{{ t('Your answer') }}</label>
            <input class="input" id="answer" name="answer" autocomplete="off" required>
          </div>
          <button class="btn btn--primary" type="submit" style="width:100%; margin-top:6px">
            Create account &amp; enter the barn
          </button>
        </form>
        <p class="faint" style="font-size:12px; text-align:center; margin-top:16px">
          This page only exists until the first account is created.
        </p>
      </div>
    </div>
  </div>
</body>
</html>
