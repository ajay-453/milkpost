<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext x='1' y='13' font-size='13'%3E%F0%9F%90%83%3C/text%3E%3C/svg%3E">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ t('Reset password') }} · {{ app_name }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/app.css">
  <link rel="stylesheet" href="/static/css/barnboard.css">
</head>
<body>
  <div style="min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px">
    <div class="card" style="width:100%; max-width:380px">
      <div class="card__body" style="padding:28px">
        <div style="text-align:center; margin-bottom:20px">
          <div style="font-size:36px">🐃</div>
          <h1 style="margin:8px 0 4px; font-size:22px">{{ t('Reset password') }}</h1>
        </div>
        {% if invalid %}
          <div class="banner-danger" style="margin-bottom:14px">
            {{ t('This reset link is invalid or has expired. Ask the farm owner for a new one.') }}
          </div>
          <a class="btn btn--primary" href="/login" style="width:100%; text-align:center">{{ t('Sign in') }}</a>
        {% else %}
          <p class="muted" style="margin-top:0">{{ t('Set a new password for') }} <strong>{{ username }}</strong>.</p>
          {% if error %}
            <div class="banner-danger" style="margin-bottom:14px">{{ t(error) }}</div>
          {% endif %}
          <form method="post" action="/reset/{{ token }}">
            <div class="field">
              <label for="password">{{ t('New password (8+ characters)') }}</label>
              <input class="input" id="password" name="password" type="password"
                     autocomplete="new-password" minlength="8" required autofocus>
            </div>
            <div class="field">
              <label for="password2">{{ t('Repeat new password') }}</label>
              <input class="input" id="password2" name="password2" type="password"
                     autocomplete="new-password" minlength="8" required>
            </div>
            <button class="btn btn--primary" type="submit" style="width:100%">{{ t('Set new password') }}</button>
          </form>
        {% endif %}
      </div>
    </div>
  </div>
</body>
</html>
